<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="50" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Molecular Hex Emblem -->
  <g transform="translate(5, 5)">
    <polygon points="20,2 35,11 35,29 20,38 5,29 5,11" stroke="url(#logoGrad)" stroke-width="2.2" fill="#0b1329"/>
    <circle cx="20" cy="2" r="2.8" fill="#00f2fe"/>
    <circle cx="35" cy="11" r="2.8" fill="#38bdf8"/>
    <circle cx="35" cy="29" r="2.8" fill="#10b981"/>
    <circle cx="20" cy="38" r="2.8" fill="#00f2fe"/>
    <circle cx="5" cy="29" r="2.8" fill="#10b981"/>
    <circle cx="5" cy="11" r="2.8" fill="#38bdf8"/>
    <circle cx="20" cy="20" r="4.5" fill="#00f2fe"/>
    <line x1="20" y1="20" x2="35" y2="11" stroke="#00f2fe" stroke-width="1.6" opacity="0.6"/>
    <line x1="20" y1="20" x2="5" y2="29" stroke="#10b981" stroke-width="1.6" opacity="0.6"/>
  </g>

  <!-- Typography -->
  <text x="56" y="25" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="18" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.3">
    Solu<tspan fill="#00f2fe">Chem</tspan>
  </text>
  <text x="56" y="38" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" letter-spacing="1.8">
    DRUG DISCOVERY ASSISTANT
  </text>
</svg>
