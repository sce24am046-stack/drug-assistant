<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="grad1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="grad2" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" stroke="url(#grad1)" stroke-width="2.5" fill="#0d1527" filter="url(#glow)"/>
  <polygon points="24,11 36,18 36,30 24,37 12,30 12,18" stroke="url(#grad2)" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>

  <!-- Molecular Nodes -->
  <circle cx="24" cy="4" r="3.5" fill="#00f2fe" />
  <circle cx="42" cy="14" r="3" fill="#38bdf8" />
  <circle cx="42" cy="34" r="3.5" fill="#10b981" />
  <circle cx="24" cy="44" r="3" fill="#00f2fe" />
  <circle cx="6" cy="34" r="3.5" fill="#10b981" />
  <circle cx="6" cy="14" r="3" fill="#38bdf8" />

  <!-- Center Core Atom & Radiating Bonds -->
  <circle cx="24" cy="24" r="5" fill="#00f2fe" filter="url(#glow)" />
  <line x1="24" y1="24" x2="24" y2="4" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>
  <line x1="24" y1="24" x2="42" y2="34" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <line x1="24" y1="24" x2="6" y2="34" stroke="#10b981" stroke-width="2" opacity="0.6"/>
</svg>
